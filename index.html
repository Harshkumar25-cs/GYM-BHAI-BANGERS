<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gym Bhai Bangers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="overlay">

        <header>
            <h1>GYM BHAI BANGERS</h1>
            <p>NO EXCUSES. JUST GAINS.</p>
        </header>


        <main class="player">

            <div class="album">
                <div class="music-icon">🎵</div>
            </div>


            <div class="song-info">

                <h2 id="song-title">
                    Gym Banger
                </h2>

                <p id="artist">
                    Gym Bhai
                </p>

            </div>


            <div class="progress-container">

                <span id="current-time">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="duration">
                    0:00
                </span>

            </div>


            <div class="controls">

                <button id="previous">
                    ⏮
                </button>

                <button id="play">
                    ▶
                </button>

                <button id="next">
                    ⏭
                </button>

            </div>


            <div class="volume">

                <span>🔊</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="100"
                    value="80"
                >

            </div>


            <section class="playlist">

                <h3>YOUR BANGERS</h3>

                <div class="track">
                    🔥 Workout Banger 01
                </div>

                <div class="track">
                    💀 Heavy Lift Mode
                </div>

                <div class="track">
                    ⚡ Beast Mode
                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
