<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Bhai Bangers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="background-overlay"></div>


    <!-- TOP BAR -->

    <header class="top-bar">

        <!-- Time -->

        <div class="top-left">

            <div id="clock">
                11:58 PM
            </div>

        </div>


        <!-- Online Users -->

        <div class="online-status">

            <span class="online-dot"></span>

            <span id="online-count">
                27
            </span>

            <span>
                online
            </span>

        </div>


        <!-- Music Links -->

        <div class="music-links">

            <a
                href="https://open.spotify.com/"
                target="_blank"
                class="music-link"
            >

                <span class="spotify-icon">
                    ●
                </span>

                Spotify

                <span class="external">
                    ↗
                </span>

            </a>


            <a
                href="https://music.youtube.com/"
                target="_blank"
                class="music-link"
            >

                <span class="youtube-music-icon">
                    ▶
                </span>

                YT Music

                <span class="external">
                    ↗
                </span>

            </a>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        <!-- Music Player -->

        <section class="music-player">


            <!-- Album Artwork -->

            <div class="album-art">

                <img
                    id="album-image"
                    src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
                    alt="Album Artwork"
                >

            </div>


            <!-- Song Information -->

            <div class="song-section">

                <div class="song-title" id="song-title">
                    Gym Banger
                </div>

                <div class="artist-name" id="artist-name">
                    Gym Bhai
                </div>


                <!-- Progress -->

                <div class="progress-area">

                    <input
                        type="range"
                        id="progress"
                        min="0"
                        max="100"
                        value="0"
                    >

                    <div class="time-display">

                        <span id="current-time">
                            0:00
                        </span>

                        <span id="total-time">
                            0:00
                        </span>

                    </div>

                </div>

            </div>


            <!-- Controls -->

            <div class="player-controls">

                <button
                    id="previous"
                    class="control-button"
                    aria-label="Previous song"
                >
                    ◀◀
                </button>


                <button
                    id="play"
                    class="play-button"
                    aria-label="Play"
                >
                    ▶
                </button>


                <button
                    id="next"
                    class="control-button"
                    aria-label="Next song"
                >
                    ▶▶
                </button>

            </div>

        </section>

    </main>

    <!-- Hidden YouTube Player -->
    <div id="youtube-player-container">
        <div id="youtube-player"></div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Gym Bhai Bangers JavaScript -->
    <script src="script.js"></script>

</body>
</html>
