<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Salman Hits</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================================
         BACKGROUND OVERLAY
    ========================================== -->

    <div class="background-overlay"></div>


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="top-bar">

        <!-- TIME -->

        <div class="top-left">

            <div id="clock">
                11:58 PM
            </div>

        </div>


        <!-- ONLINE USERS -->

        <div class="online-status">

            <span class="online-dot"></span>

            <span id="online-count">
                1
            </span>

            <span>
                online
            </span>

        </div>


        <!-- MUSIC LINKS -->

        <div class="music-links">

            <a
                href="https://open.spotify.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="music-link"
            >

                <span class="spotify-icon">
                    ●
                </span>

                <span>
                    Spotify
                </span>

                <span class="external">
                    ↗
                </span>

            </a>


            <a
                href="https://music.youtube.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="music-link"
            >

                <span class="youtube-music-icon">
                    ▶
                </span>

                <span>
                    YT Music
                </span>

                <span class="external">
                    ↗
                </span>

            </a>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>

        <!-- =====================================
             MUSIC PLAYER
        ====================================== -->

        <section class="music-player">


            <!-- ALBUM ART -->

            <div class="album-art">

                <img
                    id="album-image"
                    src="music/salman%20bhaii.png"
                    alt="Salman Hits"
                >

            </div>


            <!-- =================================
                 SONG INFORMATION
            ================================== -->

            <div class="song-section">

                <div id="song-title">
                    Chunnari Chunnari
                </div>

                <div id="artist-name">
                    Salman Hits
                </div>


                <!-- PROGRESS -->

                <div class="progress-area">

                    <input
                        type="range"
                        id="progress"
                        min="0"
                        max="100"
                        value="0"
                        aria-label="Song progress"
                    >


                    <div class="time-display">

                        <span id="current-time">
                            0:00
                        </span>

                        <span id="total-time">
                            0:00
                        </span>

                    </div>

                </div>

            </div>


            <!-- =================================
                 CONTROLS
            ================================== -->

            <div class="player-controls">


                <!-- PREVIOUS -->

                <button
                    id="previous"
                    class="control-button"
                    type="button"
                    aria-label="Previous song"
                >
                    ◀◀
                </button>


                <!-- PLAY / PAUSE -->

                <button
                    id="play"
                    class="play-button"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>


                <!-- NEXT -->

                <button
                    id="next"
                    class="control-button"
                    type="button"
                    aria-label="Next song"
                >
                    ▶▶
                </button>


            </div>

        </section>

    </main>


    <!-- =========================================
         HIDDEN LOCAL AUDIO PLAYER
    ========================================== -->

    <audio
        id="audio-player"
        preload="metadata"
    ></audio>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
